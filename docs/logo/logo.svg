<svg xmlns="http://www.w3.org/2000/svg" viewBox="169.5 170.2 677.8 677.8" width="24" height="24" class="ls-logo" role="img" aria-label="LenScout">
  <title>LenScout</title>
  <!-- Point = currentColor (encre du contexte). Cône = la variable logo-accent, repli sur currentColor.
       Inline (<svg> dans le DOM, ou <use>) : hérite de la couleur d'action et de color de LenScout, donc du thème clair/sombre/système réglé dans l'app.
       En <img src="logo.svg"> : les variables de la page n'entrent pas ; le <style> ci-dessous donne les valeurs par défaut et suit prefers-color-scheme (système seulement). -->
  <style>
    .ls-logo{color:#1c1c1e;--logo-accent:#2f6fed}
    @media (prefers-color-scheme:dark){.ls-logo{color:#f1f1f3;--logo-accent:#4d8dff}}
  </style>
  <defs><clipPath id="ls-gap"><path clip-rule="evenodd" d="M -200 -200 H 1300 V 1300 H -200 Z M 168.0 692.0 a 164 164 0 1 0 328 0 a 164 164 0 1 0 -328 0 Z"/></clipPath></defs>
  <g clip-path="url(#ls-gap)"><path d="M 332.0 692.0 L 503.0 222.2 L 788.8 488.6 Z" fill="var(--logo-accent, currentColor)" stroke="var(--logo-accent, currentColor)" stroke-width="56" stroke-linejoin="round"/></g>
  <circle cx="332.0" cy="692.0" r="104" fill="currentColor"/>
</svg>
