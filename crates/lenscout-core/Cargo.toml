[package]
name = "lenscout-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Lenscout core — découverte et configuration de caméras IP, sans Tauri"

[features]
# Active les faux (`testing.rs`) pour les tests de `src-tauri`.
testing = []

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
chacha20poly1305 = "0.10"
bytes = "1.12.1"
digest_auth = "0.3.1"
dirs-next = "2.0.0"
ping-async = "1"
futures-util = "0.3.34"
hickory-proto = "0.26.3"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
quick-xml = "0.42.0"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
socket2 = { version = "0.6.5", features = ["all"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7.20"
uuid = { version = "1.29.2", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
# getuid → getpwuid : le nom d'utilisateur de la règle sudoers (macOS) ;
# getifaddrs : l'interface qui porte une adresse posée (presence.rs).
libc = "0.2"

[dev-dependencies]
# Temps virtuel (`tokio::time::pause`) pour les tests du scanner.
tokio = { version = "1.54.1", features = ["test-util"] }
