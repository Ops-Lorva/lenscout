<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // Thème posé avant le premier rendu, pour ne pas voir le clair avant le
      // sombre. Même clé que src/lib/stores/settings.ts ; « system » = pas
      // d'attribut. Tauri ajoute le hash de ce script à la CSP du bundle.
      try {
        var t = localStorage.getItem('lenscout.theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <title>LenScout</title>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
