[package]
name = "lenscout"
version.workspace = true
edition.workspace = true
description = "Lenscout — découverte et configuration de caméras IP"
authors = []

[lib]
name = "lenscout_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lenscout-core = { path = "../crates/lenscout-core" }
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
minisign-verify = "0.2"

[dev-dependencies]
lenscout-core = { path = "../crates/lenscout-core", features = ["testing"] }
