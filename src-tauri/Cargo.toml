[package]
name = "lenscout"
version.workspace = true
edition.workspace = true
description = "LenScout — découverte et configuration de caméras IP"
authors = []

[lib]
name = "lenscout_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lenscout-core = { path = "../crates/lenscout-core" }
# Sans la feature `devtools` : l'inspecteur n'existe qu'en build de debug.
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
minisign-verify = "0.2"
base64 = "0.23.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
uuid = { version = "1.29.2", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
lenscout-core = { path = "../crates/lenscout-core", features = ["testing"] }
async-trait = "0.1.92"
bytes = "1.12.1"
futures-util = "0.3.34"
